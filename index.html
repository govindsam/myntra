<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Images</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Products</h1>

    <div id="products"></div>

    <script>

        fetch("data.json")
            .then(response => response.json())
            .then(data => {

                const container = document.getElementById("products");

                data.forEach(product => {

                    const name = product.name.trim();
                    const order_frequency = product.order_frequency;
                    const analysis_period = product.analysis_period;
                    const ok_inventory = product.ok_inventory;
                    const damage_inventory = product.damage_inventory;
                    const inventory_count_date = product.inventory_count_date;

                    // Automatically add .jpg
                    const imagePath = "images/" + name + ".jpg";

                    const img = new Image();

                    img.onload = function () {

                        const productDiv = document.createElement("div");
                        productDiv.className = "product";

                        productDiv.innerHTML = `
                            <img src="${imagePath}" alt="${name}">
                            <div class="product-name">Style Id: ${name}</div>
                            <div class="product-name">Order Frequency : ${order_frequency}</div>
                            <div class="product-name">Analysis Period : ${analysis_period}</div>
                            <div class="product-name">Ok Inventory : ${ok_inventory}</div>
                            <div class="product-name">Damage Inventory : ${damage_inventory}</div>
                            <div class="product-name">Inventory Count Date: ${inventory_count_date}</div>


                        `;

                        container.appendChild(productDiv);
                    };

                    // If image doesn't exist, do nothing
                    img.onerror = function () {
                        console.log("Image not found:", imagePath);
                    };

                    img.src = imagePath;

                });

            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });

    </script>

</body>
</html>
