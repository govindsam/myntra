<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>retrn reason</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <h1>Return reason</h1>
    <!-- for Home button -->
    <div class="home-btn" onclick="openSidebar()">
        HOME
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

        <div class="close-btn" onclick="closeSidebar()">×</div>

        <h2>Categories</h2>
        <a href="https://govindsam.github.io/myntra" target="_blank">
            Dashboard
        </a>
        <a href="https://govindsam.github.io/myntra/article/all_product" target="_blank">
            All Product
        </a>
        <a href="https://govindsam.github.io/myntra/article/earrings" target="_blank">
            Earrings
        </a>

        <a href="https://govindsam.github.io/myntra/article/jewellery_set" target="_blank">
            Jewellery Set
        </a>

        <a href="https://govindsam.github.io/myntra/article/necklace" target="_blank">
            Necklace and Chain
        </a>

        <a href="https://govindsam.github.io/myntra/article/bracelet" target="_blank">
            Bracelet
        </a>

        <a href="https://govindsam.github.io/myntra/article/ring" target="_blank">
            Ring
        </a>

        <a href="https://govindsam.github.io/myntra/article/pendant" target="_blank">
            Pendant
        </a>

        <a href="https://govindsam.github.io/myntra/article/anklet" target="_blank">
            Anklet
        </a>

        <a href="https://govindsam.github.io/myntra/article/head_jewellery" target="_blank">
            Head Jewellery
        </a>

        <a href="https://govindsam.github.io/myntra/article/saree_accessories" target="_blank">
            Saree Accessories
        </a>

        <a href="https://govindsam.github.io/myntra/article/mangalsutra" target="_blank">
            Mangalsutra
        </a>


    </div>
    <div id="products"></div>

    <script>
        // for sidebar
        function openSidebar() {
            document.getElementById("sidebar").classList.add("open");
        }
        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("open");
        }

        // Fetch and render product data safely
        fetch("return.json")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("products");
                container.innerHTML = ""; // Clear existing contents

                data.forEach(product => {



                    const item = document.createElement("div");
                    item.className = "product";

                    // 1. Image Element Setup
                    const img = document.createElement("img");
                    img.src = `../images/${product["style_id"]}.jpg`;
                    img.alt = product["style_id"];

                    // Safely handles image errors asynchronously 
                    img.onerror = function () {
                        item.remove();
                    };
                    item.appendChild(img);

                    // 2. Text Details Elements
                   if (product["type"] == "Return") {
                        const details = [
                            { label: "Style Id", value: product["style_id"] },
                            { label: "order_id", value: product["order_id"] },
                            { label: "order_created_date", value: product["order_created_date"] },
                            { label: "customer_delivered_date", value: product["customer_delivered_date"] },
                            { label: "return_created_date", value: product["return_created_date"] },
                            { label: "deliver_to_seller_date", value: product["deliver_to_seller_date"] },
                            { label: "return_reason", value: product["return_reason"] }
                        ];
                        details.forEach(detail => {
                        const p = document.createElement("p");
                        p.textContent = `${detail.label} : ${detail.value ?? 'N/A'}`;
                        item.appendChild(p);
                    });

                    }
                    

                    
                    // 3. Purchase Link Element
                    const link = document.createElement("a");
                    link.textContent = "buy";
                    link.href = "https://myntra.com/" + product["style id"];

                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    item.appendChild(link);

                    // Only append the fully constructed valid card to the DOM
                    container.appendChild(item);
                });
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });


    </script>

</body>

</html>
