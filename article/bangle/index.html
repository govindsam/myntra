<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangle Inventory</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <h1>Bangle Inventory</h1>
    <!-- for Home button -->
    <div class="home-btn" onclick="openSidebar()">
        HOME
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

        <div class="close-btn" onclick="closeSidebar()">×</div>

        <h2>Categories</h2>
        <a href="https://govindsam.github.io/myntra" target="_blank">
            All Product
        </a>
        <a href="https://govindsam.github.io/myntra/article/earrings" target="_blank">
            Earrings
        </a>

        <a href="https://govindsam.github.io/myntra/article/jewellery_set" target="_blank">
            Jewellery Set
        </a>

        <a href="https://govindsam.github.io/myntra/article/necklace" target="_blank">
            Necklace and Chain
        </a>

        <a href="https://govindsam.github.io/myntra/article/bracelet" target="_blank">
            Bracelet
        </a>

        <a href="https://govindsam.github.io/myntra/article/ring" target="_blank">
            Ring
        </a>

        <a href="https://govindsam.github.io/myntra/article/pendant" target="_blank">
            Pendant
        </a>

        <a href="https://govindsam.github.io/myntra/article/anklet" target="_blank">
            Anklet
        </a>

        <a href="https://govindsam.github.io/myntra/article/head_jewellery" target="_blank">
            Head Jewellery
        </a>

        <a href="https://govindsam.github.io/myntra/article/saree_accessories" target="_blank">
            Saree Accessories
        </a>

        <a href="https://govindsam.github.io/myntra/article/mangalsutra" target="_blank">
            Mangalsutra
        </a>


    </div>
    <div id="products"></div>

    <script>
        // for sidebar
        function openSidebar() {
            document.getElementById("sidebar").classList.add("open");
        }
        function closeSidebar() {
            document.getElementById("sidebar").classList.remove("open");
        }

        // for product image
        fetch("bangle.json")
            .then(response => response.json())
            .then(data => {

                const container = document.getElementById("products");
                container.innerHTML = "";


                data.forEach(product => {
                    const item = document.createElement("div");
                    item.className = "product";

                    const img = document.createElement("img");

                    img.src = "images/" + product.name + ".jpg";
                    img.alt = product.name;

                    // Remove product if image doesn't exist
                    img.onerror = function () {
                        item.remove();
                    };

                    item.appendChild(img);
                    const Style_Id = document.createElement("p");
                    Style_Id.textContent = "Style Id : " + product.name;
                    item.appendChild(Style_Id);

                    // const order_frequency = document.createElement("p");
                    // order_frequency.textContent = "Order Frequency : " + product.order_frequency;
                    // item.appendChild(order_frequency);

                    // const analysis_period = document.createElement("p");
                    // analysis_period.textContent = "Analysis period : " + product.analysis_period;
                    // item.appendChild(analysis_period);
                    const myntra_sku_code = document.createElement("p");
                    myntra_sku_code.textContent = "Myntra SKU :" + product.myntra_sku_code;
                    item.appendChild(myntra_sku_code);

                    const size = document.createElement("p");
                    size.textContent = "Myntra SKU :" + product.size;
                    item.appendChild(size);

                    const ok_inventory = document.createElement("p");
                    ok_inventory.textContent = "Ok Inventory :" + product.ok_inventory;
                    item.appendChild(ok_inventory);

                    const damage_inventory = document.createElement("p");
                    damage_inventory.textContent = "Damage Inventory :" + product.damage_inventory;
                    item.appendChild(damage_inventory);

                    const inventory_count_date = document.createElement("p");
                    inventory_count_date.textContent = "Inventory count date : " + product.inventory_count_date;
                    item.appendChild(inventory_count_date);

                    const link = document.createElement("a");
                    link.textContent = "buy";
                    link.href = "https://myntra.com/"+product.name;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    item.appendChild(link);

                    container.appendChild(item);
                });

            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });

    </script>

</body>

</html>
